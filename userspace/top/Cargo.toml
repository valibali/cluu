[package]
name = "cluu-top"
version = "0.1.0"
edition = "2021"
description = "CLUU container/process monitor"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[dependencies]
libcluu = { path = "../libcluu", features = ["posix"] }
libtui = { package = "cluu-libtui", path = "../libtui", features = ["runtime"] }

[[bin]]
name = "top"
path = "src/main.rs"
