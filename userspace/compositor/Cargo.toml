[package]
name = "cluu-compositor"
version = "0.1.0"
edition = "2021"
description = "CLUU TUI compositor — owns one VT, draws floating windows"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[dependencies]
libcluu = { path = "../libcluu", features = ["posix"] }
cluu_wire = { path = "../cluu_wire" }
postcard = { workspace = true }
serde = { workspace = true }

[[bin]]
name = "compositor"
path = "src/main.rs"
