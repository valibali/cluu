[package]
name = "xnes-cluu"
version = "0.1.0"
edition = "2021"
description = "CLUU platform backend for x-nes NES emulator"
authors = ["CLUU Team"]
license = "MIT"

[dependencies]
libcluu = { path = "../libcluu" }
xnes = { path = "../xnes", default-features = false }
cluu_wire = { path = "../cluu_wire" }
audiod = { package = "cluu-audiod", path = "../audiod" }

[[bin]]
name = "xnes"
path = "src/main.rs"
