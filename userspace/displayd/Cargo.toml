[package]
name = "displayd"
version = "0.1.0"
edition = "2021"
description = "CLUU display daemon — scene/composition core + linear-fb backend."
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[dependencies]
cluu_wire = { path = "../cluu_wire", default-features = false }
libcluu = { path = "../libcluu", features = ["posix"] }
postcard = { workspace = true }
serde = { workspace = true }

[lib]
name = "displayd"
crate-type = ["rlib"]

[[bin]]
name = "displayd"
path = "src/main.rs"

[features]
default = []
host-test = ["cluu_wire/host-test"]
