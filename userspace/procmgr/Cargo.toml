[package]
name = "cluu-procmgr"
version = "0.1.0"
edition = "2021"
description = "CLUU process manager server"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[dependencies]
libcluu = { path = "../libcluu" }
cluu_proto = { path = "../cluu_proto" }
postcard = { workspace = true }

[dev-dependencies]
libcluu = { path = "../libcluu", features = ["host-test"] }

[features]
default = []
host-test = ["libcluu/host-test"]  # enables std for unit tests on host

[lib]
name = "procmgr"
path = "src/lib.rs"

[[bin]]
name = "procmgr"
path = "src/main.rs"
