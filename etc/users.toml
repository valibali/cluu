# /etc/users.toml — User records for login sessions.
#
# Fields:
#   home     — absolute path to the user's home directory
#   shell    — path to the shell binary (resolved through session view)
#   profile  — CapProfile for the login session ("user", "admin", "supervisor")
#   escalate — ceiling profile for sudo (optional; if absent, sudo is rejected)
#   password — hashed password: "$sha256$<salt_hex>$<hash_hex>" (empty string = no password required)

[user.root]
home = "/home/root"
shell = "/bin/shell"
profile = "supervisor"
escalate = "supervisor"
password = ""

[user.alice]
home = "/home/alice"
shell = "/bin/shell"
profile = "user"
escalate = "admin"
password = ""

[user.guest]
home = "/home/guest"
shell = "/bin/shell"
profile = "user"
# no escalate = sudo rejected
password = ""

[user.valibali]
home = "/home/valibali"
shell = "/bin/shell"
profile = "admin"
escalate = "supervisor"
password = "$sha256$019bf1efe0e0bf325f434905971a174b$4074badbc969b0fc6ac0be001c141b56f8a970ff3cf65dc378a3c9034e7c1187"
