# CLUU Microkernel Workspace
# Complete workspace structure following SOLID principles

[workspace]
resolver = "2"
members = [
    # Build orchestration
    "xtask",

    # Kernel
    "kernel",
    "klibcluu",
    "tests/kernel",

    # Userspace
    "userspace/libcluu",
    "userspace/init",
    "userspace/procmgr",
    "userspace/vfs",
    "userspace/ramfs",
    "userspace/console",
    "userspace/kbd",
    "userspace/tty",
    "userspace/vtmgr",
    "userspace/shell",
    "userspace/registry",
    "userspace/timeserver",
    "userspace/cat",
    "userspace/grep",
    "userspace/head",
    "userspace/tail",
    "userspace/wc",
    "userspace/ls",
    "userspace/ps",
    "userspace/touch",
    "userspace/top",
    "userspace/probes/nestprobe",
    "userspace/probes/escalateprobe",
    "userspace/probes/viewprobe",
    "userspace/probes/argvprobe",
    "userspace/probes/jobchurn",
    "userspace/probes/jobmix",
    "userspace/probes/killdeny",
    "userspace/probes/regdeny",
    "userspace/probes/mapfail",
    "userspace/probes/mapcopyfail",
    "userspace/probes/maperror",
    "userspace/probes/ext2io",
    "userspace/probes/ownerdeny",
    "userspace/probes/ringio",
    "userspace/probes/vtcrash",
    "userspace/probes/sudotest",
    "userspace/probes/sutest",
    "userspace/cp",
    "userspace/edit",
    "userspace/mkdir",
    "userspace/probes/mountprobe",
    "userspace/mv",
    "userspace/rm",
    "userspace/probes/suspendprobe",
    "userspace/probes/cascadeprobe",
    "userspace/probes/detachprobe",
    "userspace/virtio-core",
    "userspace/virtio-blk",
    "userspace/probes/vqprobe",
    "userspace/probes/blkprobe",
    "userspace/tpmd",
    "userspace/libcluu_syscalls",
    "userspace/basename",
    "userspace/date",
    "userspace/dirname",
    "userspace/env",
    "userspace/kill",
    "userspace/printf",
    "userspace/sleep",
    "userspace/which",

    # Language tooling
    "crates/cluu_lang",
    "crates/cluu_lang_harness",

    # Host tools
    "tools/container-build",
]

# Exclude xtask from default members (it uses std)
default-members = [
    "kernel",
    "klibcluu",
    "userspace/libcluu",
    "userspace/init",
    "userspace/procmgr",
    "userspace/vfs",
    "userspace/ramfs",
    "userspace/console",
    "userspace/kbd",
    "userspace/tty",
    "userspace/vtmgr",
    "userspace/shell",
    "userspace/registry",
    "userspace/timeserver",
    "userspace/cat",
    "userspace/grep",
    "userspace/head",
    "userspace/tail",
    "userspace/wc",
    "userspace/ls",
    "userspace/ps",
    "userspace/touch",
    "userspace/top",
    "userspace/cp",
    "userspace/edit",
    "userspace/mkdir",
    "userspace/mv",
    "userspace/rm",
    "userspace/virtio-core",
    "userspace/virtio-blk",
    "userspace/tpmd",
    "userspace/basename",
    "userspace/date",
    "userspace/dirname",
    "userspace/env",
    "userspace/kill",
    "userspace/printf",
    "userspace/sleep",
    "userspace/which",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
bitflags = "2.4"
spin = "0.9"
log = "0.4"
lazy_static = { version = "1.4", features = ["spin_no_std"] }

# x86_64 architecture support
x86_64 = "0.15"

# Testing
proptest = "1.4"

# Profile configuration (applies to entire workspace)
[profile.dev]
opt-level = 0
lto = false
panic = "abort"

[profile.dev.package.libcluu]
debug = 0


[profile.dev.package."cluu-init"]
debug = 0

