# CLUU Microkernel Workspace
# Complete workspace structure following SOLID principles

[workspace]
resolver = "2"
members = [
    # Build orchestration
    "xtask",

    # Kernel
    "kernel",
    "klibcluu",
    "tests/kernel",

    # Userspace
    "userspace/libcluu",
    "userspace/init",
    "userspace/procmgr",
    "userspace/vfs",
    "userspace/ramfs",
    "userspace/console",
    "userspace/kbd",
    "userspace/tty",
    "userspace/vtmgr",
    "userspace/shell",
    "userspace/registry",
    "userspace/timeserver",
    "userspace/cat",
    "userspace/grep",
    "userspace/top",
    "userspace/nestprobe",
    "userspace/escalateprobe",
    "userspace/viewprobe",
    "userspace/argvprobe",
    "userspace/cp",
    "userspace/mkdir",
    "userspace/mountprobe",
    "userspace/mv",
    "userspace/rm",
    "userspace/suspendprobe",
    "userspace/cascadeprobe",
    "userspace/detachprobe",
    "userspace/virtio-blk",
    "userspace/tpmd",
    "userspace/libcluu_syscalls",

    # Language tooling
    "crates/cluu_lang",
    "crates/cluu_lang_harness",

    # Host tools
    "tools/container-build",
]

# Exclude xtask from default members (it uses std)
default-members = [
    "kernel",
    "klibcluu",
    "userspace/libcluu",
    "userspace/init",
    "userspace/procmgr",
    "userspace/vfs",
    "userspace/ramfs",
    "userspace/console",
    "userspace/kbd",
    "userspace/tty",
    "userspace/vtmgr",
    "userspace/shell",
    "userspace/registry",
    "userspace/timeserver",
    "userspace/cat",
    "userspace/grep",
    "userspace/top",
    "userspace/nestprobe",
    "userspace/escalateprobe",
    "userspace/viewprobe",
    "userspace/argvprobe",
    "userspace/cp",
    "userspace/mkdir",
    "userspace/mountprobe",
    "userspace/mv",
    "userspace/rm",
    "userspace/suspendprobe",
    "userspace/cascadeprobe",
    "userspace/detachprobe",
    "userspace/virtio-blk",
    "userspace/tpmd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[workspace.dependencies]
# Core dependencies
bitflags = "2.4"
spin = "0.9"
log = "0.4"
lazy_static = { version = "1.4", features = ["spin_no_std"] }

# x86_64 architecture support
x86_64 = "0.15"

# Testing
proptest = "1.4"

# Profile configuration (applies to entire workspace)
[profile.dev]
opt-level = 0
lto = false
panic = "abort"

[profile.dev.package.libcluu]
debug = 0


[profile.dev.package."cluu-init"]
debug = 0

[profile.dev.package."cluu-procmgr"]
debug = 0

[profile.dev.package."cluu-console"]
debug = 0

[profile.dev.package."cluu-kbd"]
debug = 0

