[project]
name = "cluu-harness"
version = "0.1.0"
description = "CLUU gen2 test harness — event-driven QEMU integration tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CLUU project" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.scripts]
cluu-harness = "cluu_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cluu_harness"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default arg (used for dataclass defaults)
    "SIM108", # ternary vs if/else — clarity wins
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["cluu_harness/tests", "."]
addopts = "-ra --strict-markers"
markers = [
    "slow: integration cases that boot a real QEMU (deselected by default)",
    "smoke: fast non-QEMU sanity checks",
]
