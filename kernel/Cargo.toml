[package]
name = "cluu-kernel"
version = "0.1.0"
edition = "2021"
description = "CLUU microkernel"
authors = ["CLUU Team", "Balazs Valkony"]
license = "MIT"

[dependencies]
bitflags = { workspace = true }
spin = { workspace = true }
log = { workspace = true }
lazy_static = { workspace = true }
x86_64 = { workspace = true }

# Kernel support library
klibcluu = { path = "../klibcluu" }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
test-mock = ["klibcluu/test-mock"]

[[bin]]
name = "kernel"
path = "src/main.rs"

[lib]
name = "cluu_kernel"
path = "src/lib.rs"
